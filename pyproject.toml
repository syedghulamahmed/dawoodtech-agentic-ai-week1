[project]
name = "dawoodtech-week1-agentic-ai"
version = "1.0.0"
description = "A provider-switchable, tool-using terminal assistant built with a hand-written agent loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50.0,<3.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10.0.0", "ruff>=0.6.0,<1.0.0"]

[project.scripts]
agentic-assistant = "agentic_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"